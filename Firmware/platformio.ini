; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = Upload_ISP

; Shared by the AVR environments. Not inherited by native tests.
[avr]
platform = atmelavr
framework = arduino
board = ATmega328PB
board_build.f_cpu = 8000000L
board_hardware.oscillator = internal
build_unflags = -flto
monitor_speed = 9600
lib_deps =
    adafruit/Adafruit ADS1X15@^2.5.0

; Arduino used as programmer (change this)
;upload_port = COM3          ; Windows
; upload_port = /dev/ttyUSB0  ; Linux
; upload_port = /dev/cu.usbmodem*  ; macOS

; --- Upload sketch via Arduino as ISP ---
[env:Upload_ISP]
extends = avr
upload_protocol = custom
upload_port = COM3
upload_speed = 19200
upload_flags =
    -C$PROJECT_PACKAGES_DIR/tool-avrdude/avrdude.conf
    -p$BOARD_MCU
    -cstk500v1
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i

; --- Set fuses ---
[env:fuses_bootloader]
extends = avr
test_ignore = test_desktop
board_hardware.oscillator = internal
board_build.f_cpu = 8000000L
board_bootloader.type = no_bootloader
board_hardware.bod = 2.7v
board_hardware.eesave = yes

upload_protocol = stk500v1
upload_speed = 19200
upload_flags =
  -P$UPLOAD_PORT
  -b$UPLOAD_SPEED
  -B5

; Desktop Unity tests. No board required.
[env:native]
platform = native
test_framework = unity
