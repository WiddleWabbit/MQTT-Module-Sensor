; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATmega328PB]
platform = atmelavr
board = ATmega328PB
framework = arduino
; Force PlatformIO to use MiniCore instead of the standard Arduino core
board_build.core = MiniCore

; --- CLOCK SETTINGS ---
board_build.f_cpu = 8000000L
board_hardware.oscillator = internal

; Custom upload protocol using avrdude
upload_protocol = custom
upload_port = COM3          ; Replace with COM PORT
upload_speed = 19200        ; ArduinoISP sketch communicates at 19200 baud

upload_flags =
    -C
    ${platformio.packages_dir}/tool-avrdude/avrdude.conf
    -p
    $BOARD_MCU
    -P
    $UPLOAD_PORT
    -b
    $UPLOAD_SPEED
    -c
    stk500v1

; Command used by PlatformIO when uploading
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:iBas